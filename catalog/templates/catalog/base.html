{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Магазин MY-RELAX{% endblock %}</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <link href="{% static 'css/ai_chat.css' %}" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-0">
    <div class="d-flex">
        <!-- Подшаблон главного меню -->
        {% include 'catalog/includes/menu.html' %}

        <!-- Уникальный контент каждой страницы -->
        <div class="content-shifted p-3 p-md-4">
            {% block content %}{% endblock %}

            <div class="position-fixed bottom-0 end-0 m-4" style="z-index: 1060;">
                <button class="btn btn-sage btn-lg shadow d-flex align-items-center gap-2">
                    🤖 ИИ-Ассистент
                </button>
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
{% block extra_js %}{% endblock %}
<script src="{% static 'js/ai_chat.js' %}"></script>
</body>
</html>
