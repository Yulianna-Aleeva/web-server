{% extends 'catalog/base.html' %}

{% block title %}Удаление товара — Магазин MY-RELAX{% endblock %}

{% block content %}
<div class="card shadow-sm border-0 p-4 mx-auto text-center" style="max-width: 550px; border-radius: 10px;">
    <h3 class="fw-bold text-danger mb-3">Удалить товар?</h3>
    <p class="text-muted mb-4">
        Вы действительно хотите безвозвратно удалить товар <strong>«{{ object.name }}»</strong>?
    </p>

    <form method="post" class="d-flex justify-content-center gap-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger fw-bold px-4">Да, удалить</button>
        <a href="{% url 'catalog:product_detail' object.pk %}" class="btn btn-outline-secondary px-4">Отмена</a>
    </form>
</div>
{% endblock %}
