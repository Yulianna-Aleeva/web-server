<nav id="main-menu" class="bg-dark text-white p-3 d-flex flex-column">
    <h4 class="fw-bold mb-4 px-2">Меню</h4>

    <ul class="nav nav-pills flex-column gap-2">
        <li class="nav-item">
            <a href="{% url 'catalog:home' %}"
               class="nav-link text-white {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                🏡 Главная
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'catalog:catalog_list' %}"
               class="nav-link text-white {% if request.resolver_match.url_name == 'catalog_list' %}active{% endif %}">
                🌿 Каталог
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'blogs:blog_list' %}"
               class="nav-link text-white {% if request.resolver_match.app_name == 'blogs' %}active{% endif %}">
                📰 Блог
            </a>
        </li>
        <li class="nav-item">
            <a href="{% url 'catalog:contacts' %}"
               class="nav-link text-white {% if request.resolver_match.url_name == 'contacts' %}active{% endif %}">
                💌 Контакты
            </a>
        </li>
    </ul>

    <div class="mt-auto pt-3 border-top border-secondary">
        {% if user.is_authenticated %}
        <div class="d-flex align-items-center gap-2 px-2 mb-2">
            {% if user.avatar %}
            <img src="{{ user.avatar.url }}" alt="Аватар"
                 class="rounded-circle" style="width: 32px; height: 32px; object-fit: cover;">
            {% else %}
            <span>💆‍♀️</span>
            {% endif %}
            <span class="small text-white text-truncate" title="{{ user.email }}">
                    {{ user.first_name|default:user.email }}
                </span>
        </div>
        <form method="post" action="{% url 'users:logout' %}" class="px-2 mb-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-outline-light btn-sm w-100">Выйти</button>
        </form>
        {% else %}
        <div class="d-flex flex-column gap-2 px-2 mb-2">
            <a href="{% url 'users:login' %}" class="btn btn-sage btn-sm fw-bold w-100">Войти</a>
            <a href="{% url 'users:register' %}" class="btn btn-outline-light btn-sm w-100">Регистрация</a>
        </div>
        {% endif %}

        <div class="text-muted small px-2 pt-2 border-top border-secondary">
            Магазин MY-RELAX
        </div>
    </div>
</nav>
