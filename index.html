<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная — Магазин</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <link href="/static/css/ai_chat.css" rel="stylesheet">
</head>
<body>
<div class="container-fluid p-0">
    <div class="d-flex">
        <!-- Левая колонка: Динамическое боковое меню -->
        <div id="main-menu" class="bg-dark text-white p-4"></div>

        <!-- Правая колонка: Основной контент главной страницы -->
        <div class="content-shifted p-5">
            <div class="text-center mb-5">
                <h1 class="display-3 fw-normal mb-3">Добро пожаловать в магазин "MY-RELAX"!</h1>
                <p class="lead text-muted fs-4">Здесь вы найдете игровые Печеньки, подсказки для любимых игр и реальные
                    товары по их мотивам.</p>
                <hr class="my-4">
                <p class="text-secondary">← Воспользуйтесь боковым меню для перехода в нужный раздел.</p>
            </div>

            <!-- Активные плитки-категории со ссылками на разделы -->
            <div class="row g-4 mt-2">
                <div class="col-md-4">
                    <a href="/categories#cookies"
                       class="card h-100 shadow-sm text-center p-4 text-decoration-none border border-2 border-warning custom-tile"
                       style="border-radius: 10px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <span class="display-4 mb-2 emoji-cookie"></span>
                            <h5 class="card-title text-dark fw-bold">Печеньки</h5>
                            <small class="text-warning mt-2">Перейти →</small>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/categories#hints"
                       class="card h-100 shadow-sm text-center p-4 text-decoration-none border border-2 border-success custom-tile"
                       style="border-radius: 10px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <span class="display-4 mb-2 emoji-hint"></span>
                            <h5 class="card-title text-dark fw-bold">Подсказки</h5>
                            <small class="text-success mt-2">Перейти →</small>
                        </div>
                    </a>
                </div>
                <div class="col-md-4">
                    <a href="/categories#toys"
                       class="card h-100 shadow-sm text-center p-4 text-decoration-none border border-2 border-primary custom-tile"
                       style="border-radius: 10px;">
                        <div class="card-body d-flex flex-column align-items-center justify-content-center">
                            <span class="display-4 mb-2 emoji-toy"></span>
                            <h5 class="card-title text-dark fw-bold">Реплики игр</h5>
                            <small class="text-primary mt-2">Перейти →</small>
                        </div>
                    </a>
                </div>
            </div>

            <!-- Кнопка вызова робота-помощника -->
            <div class="position-fixed bottom-0 end-0 m-4" style="z-index: 1060;">
                <button class="btn btn-primary btn-lg shadow d-flex align-items-center gap-2">
                    <span class="emoji-robot"></span> ИИ-Ассистент
                </button>
            </div>
        </div>
    </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/emojis.js"></script>
<script src="/static/js/products.js"></script>
<script src="/static/js/menu.js"></script>
<script src="/static/js/store.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        document.querySelector(".emoji-cookie").textContent = EMOJIS.COOKIE;
        document.querySelector(".emoji-hint").textContent = EMOJIS.HINT;
        document.querySelector(".emoji-toy").textContent = EMOJIS.TOY;
    });
</script>
<script src="/static/js/ai_chat.js"></script>
</body>
</html>
