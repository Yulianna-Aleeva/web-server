{% extends 'catalog/base.html' %}

{% block title %}Вход — Магазин MY-RELAX{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 450px;">
    <div class="card shadow-sm border-0 p-4" style="border-radius: 12px;">
        <h2 class="fw-bold text-center mb-1">🏡 Вход в аккаунт</h2>
        <p class="text-muted text-center small mb-4">Введите вашу почту и пароль</p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-sage fw-bold w-100 mt-2">Войти</button>
        </form>

        <div class="text-center mt-3 pt-3 border-top small">
            Ещё нет аккаунта?
            <a href="{% url 'users:register' %}" class="fw-semibold text-decoration-none" style="color: #4c6b5c;">Зарегистрироваться</a>
        </div>
    </div>
</div>
{% endblock %}
