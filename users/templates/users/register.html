{% extends 'catalog/base.html' %}

{% block title %}Регистрация — Магазин MY-RELAX{% endblock %}

{% block content %}
<div class="mx-auto" style="max-width: 520px;">
    <div class="card shadow-sm border-0 p-4" style="border-radius: 12px;">
        <h2 class="fw-bold text-center mb-1">🌿 Регистрация</h2>
        <p class="text-muted text-center small mb-4">Создайте аккаунт в магазине MY-RELAX</p>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-sage fw-bold w-100 mt-2">Зарегистрироваться</button>
        </form>

        <div class="text-center mt-3 pt-3 border-top small">
            Уже есть аккаунт?
            <a href="{% url 'users:login' %}" class="fw-semibold text-decoration-none" style="color: #4c6b5c;">Войти</a>
        </div>
    </div>
</div>
{% endblock %}
