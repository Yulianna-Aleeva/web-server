{% extends 'catalog/base.html' %}

{% block title %}Удалить статью — Блог{% endblock %}

{% block content %}
<div class="card border-danger shadow-sm p-4" style="max-width: 550px; border-radius: 10px;">
    <h2 class="fw-bold text-danger mb-3">Удаление записи</h2>
    <p class="fs-5">Вы уверены, что хотите удалить статью <strong>«{{ blog.title }}»</strong>?</p>
    <form method="POST" class="d-flex gap-2 mt-3">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger fw-bold">Да, удалить</button>
        <a href="{% url 'blogs:blog_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
